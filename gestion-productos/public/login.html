<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>

    <h1>Iniciar Sesión</h1>

    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="Correo"
            required
        >

        <br><br>

        <input
            type="password"
            id="password"
            placeholder="Contraseña"
            required
        >

        <br><br>

        <button type="submit">
            Iniciar Sesión
        </button>

    </form>

    <script>
        document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {

            e.preventDefault();

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;

            const response = await fetch(
                "/api/auth/login",
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                        "application/json"
                    },
                    body: JSON.stringify({
                        email,
                        password
                    })
                }
            );

            const data =
                await response.json();

            alert(
                "Token JWT: " + data.token
            );

        });
    </script>

</body>
</html>
